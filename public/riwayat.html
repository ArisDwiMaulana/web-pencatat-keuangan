<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencatat Keuangan</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="bg-[#f0f4f8] min-h-screen text-slate-800">
    <header class="bg-white border-b border-slate-100">
      <div
        class="md:w-10/12 lg:w-6/12 md:mx-auto py-4 px-6 md:px-12 flex justify-between items-center"
      >
        <h1 class="text-xl font-bold text-slate-800">Keuangan Pribadi</h1>
        <nav class="flex items-center gap-2">
          <a
            href="index.html"
            class="btn text-slate-500 hover:text-slate-700 px-4 py-2 text-sm font-medium transition"
            >Catat</a
          >

          <a
            href="#"
            class="btn bg-[#181e2b] text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition"
            >Riwayat</a
          >
        </nav>
      </div>
    </header>

    <!-- Kontainer Utama -->
    <main class="max-w-2xl mx-auto px-4 py-8 space-y-5">
      <!-- Kartu Filter Transaksi -->
      <div
        class="bg-white rounded-xl border border-slate-200/80 p-6 shadow-sm space-y-4"
      >
        <!-- Baris 1: Periode & Jenis -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Periode -->
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1.5"
              >Periode</label
            >
            <div class="relative">
              <select
                id="filter-periode"
                class="w-full appearance-none bg-white border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer pr-10"
              >
                <option value="minggu-ini">Minggu Ini</option>
                <option value="bulan-ini">Bulan Ini</option>
                <option value="semua">Semua</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-700"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Tipe -->
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1.5"
              >Tipe</label
            >
            <div class="relative">
              <select
                id="filter-tipe"
                class="w-full appearance-none bg-white border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer pr-10"
              >
                <option value="semua">Semua</option>
                <option value="pemasukan">Pemasukan</option>
                <option value="pengeluaran">Pengeluaran</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-700"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Baris 2: Jenis Transaksi & Tombol Ekspor CSV -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Kategori -->
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1.5"
              >Jenis Transaksi</label
            >
            <div class="relative">
              <select
                id="filter-jenis"
                class="w-full appearance-none bg-white border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer pr-10"
              >
                <option value="semua">Semua</option>
                <option value="Cash">Cash</option>
                <option value="Cashless">Cashless</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-700"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Tombol Ekspor CSV -->
          <div class="flex items-end">
            <button
              id="btn-ekspor-csv"
              type="button"
              class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-medium py-2.5 rounded-lg text-sm transition"
            >
              Ekspor CSV
            </button>
          </div>
        </div>

        <!-- Baris 3: Dari Tanggal & Sampai Tanggal -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Dari Tanggal -->
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1.5"
              >Dari tanggal</label
            >
            <div class="relative">
              <input
                id="filter-dari-tanggal"
                type="date"
                class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
              />
            </div>
          </div>

          <!-- Sampai Tanggal -->
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1.5"
              >Sampai tanggal</label
            >
            <div class="relative">
              <input
                id="filter-sampai-tanggal"
                type="date"
                class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
              />
            </div>
          </div>
        </div>

        <!-- Baris 4: Tombol Aksi (Tampilkan & Reset) -->
        <div class="flex gap-3 pt-1">
          <button
            id="btn-tampilkan"
            type="button"
            class="flex-1 bg-[#181e2b] hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg text-sm transition"
          >
            Tampilkan
          </button>
          <button
            id="btn-reset"
            type="button"
            class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-5 py-2.5 rounded-lg text-sm font-medium transition"
          >
            Reset
          </button>
        </div>
      </div>

      <!-- Kartu Ringkasan Filtered -->
      <div class="bg-white rounded-xl border border-slate-200/80 p-5 shadow-sm">
        <div class="grid grid-cols-3 text-center">
          <!-- Masuk -->
          <div>
            <p class="text-xs text-slate-500 font-medium mb-1">Masuk</p>
            <p id="ringkasan-masuk" class="text-base sm:text-lg font-bold text-[#10b981]">0</p>
          </div>
          <!-- Keluar -->
          <div>
            <p class="text-xs text-slate-500 font-medium mb-1">Keluar</p>
            <p id="ringkasan-keluar" class="text-base sm:text-lg font-bold text-[#ef4444]">0</p>
          </div>
          <!-- Saldo -->
          <div>
            <p class="text-xs text-slate-500 font-medium mb-1">Saldo</p>
            <p id="ringkasan-saldo" class="text-base sm:text-lg font-bold text-slate-800">0</p>
          </div>
        </div>
      </div>

      <!-- Kartu Daftar Transaksi -->
      <div
        class="bg-white rounded-xl border border-slate-200/80 shadow-sm overflow-hidden"
      >
        <!-- Header Kartu -->
        <div
          id="transaksi-total"
          class="px-5 py-3.5 border-b border-slate-100 text-xs text-slate-400"
        >
          0 transaksi
        </div>

        <!-- List Transaksi -->
        <div id="daftar-transaksi" class="divide-y divide-slate-100">
          <div class="p-8 text-center text-sm text-slate-400">
            Memuat transaksi...
          </div>
        </div>

        <!-- Footer Pagination -->
        <div
          class="p-4 border-t border-slate-100 flex justify-between items-center"
        >
          <button
            id="btn-prev"
            class="border border-slate-200 text-slate-400 bg-white px-3 py-1.5 rounded-lg text-xs font-medium cursor-not-allowed"
          >
            Sebelumnya
          </button>
          <span id="halaman-info" class="text-xs text-slate-500">Halaman 1 dari 1</span>
          <button
            id="btn-next"
            class="border border-slate-200 text-slate-400 bg-white px-3 py-1.5 rounded-lg text-xs font-medium cursor-not-allowed"
          >
            Berikutnya
          </button>
        </div>
      </div>
    </main>
  </body>
  <script src="js/halaman_riwayat/riwayat.js"></script>
</html>
