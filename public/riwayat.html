<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencatat Keuangan</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="bg-[#f0f4f8] min-h-screen text-slate-800">
    <header class="bg-white border-b border-slate-100">
      <div
        class="md:w-10/12 lg:w-6/12 md:mx-auto py-4 px-6 md:px-12 flex justify-between items-center"
      >
        <h1 class="text-xl font-bold text-slate-800">Keuangan Pribadi</h1>
        <nav class="flex items-center gap-2">
          <a
            href="index.html"
            class="btn text-slate-500 hover:text-slate-700 px-4 py-2 text-sm font-medium transition"
            >Catat</a
          >

          <a
            href="#"
            class="btn bg-[#181e2b] text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition"
            >Riwayat</a
          >
        </nav>
      </div>
    </header>

    <!-- Kontainer Utama -->
    <main class="max-w-2xl mx-auto px-4 py-8 space-y-5">
      <!-- Kartu Filter Transaksi -->
      <div
        class="bg-white rounded-xl border border-slate-200/80 p-6 shadow-sm space-y-4"
      >
        <!-- Baris 1: Periode & Jenis -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Periode -->
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1.5"
              >Periode</label
            >
            <div class="relative">
              <select
                class="w-full appearance-none bg-white border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer pr-10"
              >
                <option value="1-minggu">1 minggu</option>
                <option value="1-bulan">1 bulan</option>
                <option value="semua">Semua</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-700"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Jenis -->
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1.5"
              >Jenis</label
            >
            <div class="relative">
              <select
                class="w-full appearance-none bg-white border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer pr-10"
              >
                <option value="semua">Semua</option>
                <option value="pemasukan">Pemasukan</option>
                <option value="pengeluaran">Pengeluaran</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-700"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Baris 2: Kategori & Tombol Ekspor CSV -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Kategori -->
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1.5"
              >Kategori</label
            >
            <div class="relative">
              <select
                class="w-full appearance-none bg-white border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer pr-10"
              >
                <option value="semua">Semua kategori</option>
                <option value="makanan">Makanan & Minuman</option>
                <option value="transportasi">Transportasi</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-700"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Tombol Ekspor CSV -->
          <div class="flex items-end">
            <button
              type="button"
              class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-medium py-2.5 rounded-lg text-sm transition"
            >
              Ekspor CSV
            </button>
          </div>
        </div>

        <!-- Baris 3: Dari Tanggal & Sampai Tanggal -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Dari Tanggal -->
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1.5"
              >Dari tanggal</label
            >
            <div class="relative">
              <input
                type="text"
                placeholder="mm/dd/yyyy"
                class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
              />
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-700"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                  ></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Sampai Tanggal -->
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1.5"
              >Sampai tanggal</label
            >
            <div class="relative">
              <input
                type="text"
                placeholder="mm/dd/yyyy"
                class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
              />
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-700"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                  ></path>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Baris 4: Tombol Aksi (Tampilkan & Reset) -->
        <div class="flex gap-3 pt-1">
          <button
            type="button"
            class="flex-1 bg-[#181e2b] hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg text-sm transition"
          >
            Tampilkan
          </button>
          <button
            type="button"
            class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-5 py-2.5 rounded-lg text-sm font-medium transition"
          >
            Reset
          </button>
        </div>
      </div>

      <!-- Kartu Ringkasan Filtered -->
      <div class="bg-white rounded-xl border border-slate-200/80 p-5 shadow-sm">
        <div class="grid grid-cols-3 text-center">
          <!-- Masuk -->
          <div>
            <p class="text-xs text-slate-500 font-medium mb-1">Masuk</p>
            <p class="text-base sm:text-lg font-bold text-[#10b981]">300.000</p>
          </div>
          <!-- Keluar -->
          <div>
            <p class="text-xs text-slate-500 font-medium mb-1">Keluar</p>
            <p class="text-base sm:text-lg font-bold text-[#ef4444]">39.500</p>
          </div>
          <!-- Saldo -->
          <div>
            <p class="text-xs text-slate-500 font-medium mb-1">Saldo</p>
            <p class="text-base sm:text-lg font-bold text-slate-800">260.500</p>
          </div>
        </div>
      </div>

      <!-- Kartu Daftar Transaksi -->
      <div
        class="bg-white rounded-xl border border-slate-200/80 shadow-sm overflow-hidden"
      >
        <!-- Header Kartu -->
        <div
          class="px-5 py-3.5 border-b border-slate-100 text-xs text-slate-400"
        >
          3 transaksi
        </div>

        <!-- List Transaksi -->
        <div class="divide-y divide-slate-100">
          <!-- Transaksi 1 -->
          <div
            class="p-5 flex justify-between items-center hover:bg-slate-50/50 transition"
          >
            <div>
              <h3 class="text-sm font-semibold text-slate-800">
                Uang Mingguan
              </h3>
              <p class="text-xs text-slate-400 mt-1">03 Okt 2026</p>
            </div>
            <div class="flex items-center gap-4">
              <span class="text-sm font-bold text-[#10b981]">+Rp300.000</span>
              <button
                class="text-xs text-slate-400 hover:text-red-500 transition"
              >
                Hapus
              </button>
            </div>
          </div>

          <!-- Transaksi 2 -->
          <div
            class="p-5 flex justify-between items-center hover:bg-slate-50/50 transition"
          >
            <div>
              <h3 class="text-sm font-semibold text-slate-800">Makan</h3>
              <p class="text-xs text-slate-400 mt-1">
                03 Okt 2026 · beli buntil dan baso goreng
              </p>
            </div>
            <div class="flex items-center gap-4">
              <span class="text-sm font-bold text-[#ef4444]">-Rp14.500</span>
              <button
                class="text-xs text-slate-400 hover:text-red-500 transition"
              >
                Hapus
              </button>
            </div>
          </div>

          <!-- Transaksi 3 -->
          <div
            class="p-5 flex justify-between items-center hover:bg-slate-50/50 transition"
          >
            <div>
              <h3 class="text-sm font-semibold text-slate-800">Makan</h3>
              <p class="text-xs text-slate-400 mt-1">
                03 Okt 2026 · nasi goreng via proxy
              </p>
            </div>
            <div class="flex items-center gap-4">
              <span class="text-sm font-bold text-[#ef4444]">-Rp25.000</span>
              <button
                class="text-xs text-slate-400 hover:text-red-500 transition"
              >
                Hapus
              </button>
            </div>
          </div>
        </div>

        <!-- Footer Pagination -->
        <div
          class="p-4 border-t border-slate-100 flex justify-between items-center"
        >
          <button
            class="border border-slate-200 text-slate-400 bg-white px-3 py-1.5 rounded-lg text-xs font-medium cursor-not-allowed"
          >
            Sebelumnya
          </button>
          <span class="text-xs text-slate-500">Halaman 1 dari 1</span>
          <button
            class="border border-slate-200 text-slate-400 bg-white px-3 py-1.5 rounded-lg text-xs font-medium cursor-not-allowed"
          >
            Berikutnya
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
