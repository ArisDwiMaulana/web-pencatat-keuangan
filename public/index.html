<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencatat Keuangan</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="bg-[#f0f4f8] min-h-screen text-slate-800">
    <!-- Header / Navbar Top -->
    <header class="bg-white border-b border-slate-100">
      <div
        class="md:w-10/12 lg:w-6/12 md:mx-auto py-4 px-6 md:px-12 flex justify-between items-center"
      >
        <h1 class="text-xl font-bold text-slate-800">Keuangan Pribadi</h1>
        <nav class="flex items-center gap-2">
          <a
            href="#"
            class="btn bg-[#181e2b] text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition"
            >Catat</a
          >
          <a
            href="riwayat.html"
            class="btn text-slate-500 hover:text-slate-700 px-4 py-2 text-sm font-medium transition"
            >Riwayat</a
          >
        </nav>
      </div>
    </header>

    <!-- Kontainer Utama -->
    <main class="max-w-2xl mx-auto px-4 py-8 space-y-5">
      <!-- Kartu Form Transaksi -->
      <div
        class="bg-white rounded-xl border border-slate-200/80 p-6 shadow-sm space-y-5"
      >
        <!-- Tombol Switch Pengeluaran / Pemasukan -->
        <div class="grid grid-cols-2 gap-3">
          <button
            type="button"
            class="btn bg-red-600 text-white py-2.5 rounded-lg font-medium text-center hover:bg-red-700 transition"
            id="pengeluaran"
          >
            Pengeluaran
          </button>
          <button
            type="button"
            class="btn bg-white border border-slate-200 text-slate-600 py-2.5 rounded-lg font-medium text-center hover:bg-slate-50 transition"
            id="pemasukan"
          >
            Pemasukan
          </button>
        </div>

        <!-- Form Isian -->
        <form class="space-y-4" id="form-catat">
          <!-- Input Kategori -->
          <div>
            <label
              class="block text-sm font-semibold text-slate-700 mb-1.5"
              for="select-kategori"
              >Kategori</label
            >
            <div class="relative" id="kategori">
              <select
                class="select appearance-none w-full"
                required
                id="select-kategori"
                name="kategori"
              >
                <option>Makan</option>
                <option>Bensin</option>
                <option>Kebutuhan Lainnya</option>
              </select>
            </div>
          </div>

          <!-- Input Jenis Transaksi -->
          <div>
            <label
              class="block text-sm font-semibold text-slate-700 mb-1.5"
              for="jenis_transaksi"
              >Jenis Transaksi</label
            >
            <div class="relative">
              <select
                class="select appearance-none w-full"
                required
                id="jenis_transaksi"
                name="jenis_transaksi"
              >
                <option>Cash</option>
                <option>Cashless</option>
              </select>
            </div>
          </div>

          <!-- Input Nominal -->
          <div>
            <label
              class="block text-sm font-semibold text-slate-700 mb-1.5"
              for="nominal"
              >Nominal</label
            >
            <div
              class="flex rounded border border-slate-200 overflow-hidden focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-transparent"
            >
              <span
                class="bg-slate-50 border-r border-slate-200 px-3.5 py-2.5 text-slate-500 text-sm font-medium flex items-center"
              >
                Rp
              </span>
              <input
                type="number"
                placeholder="25.000"
                required
                name="nominal"
                id="nominal"
                class="w-full px-3.5 py-2.5 text-slate-700 placeholder-slate-400 focus:outline-none text-sm border border-transparent focus:border-transparent focus:ring-0"
              />
            </div>
          </div>

          <!-- Input Tanggal & Keterangan (2 Kolom Grid) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Input Tanggal -->
            <div>
              <label
                class="block text-sm font-semibold text-slate-700 mb-1.5"
                for="tanggal"
                >Tanggal</label
              >
              <div class="relative">
                <input
                  type="date"
                  required
                  name="tanggal"
                  id="tanggal"
                  class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                />
              </div>
            </div>

            <!-- Input Keterangan -->
            <div>
              <label
                class="block text-sm font-semibold text-slate-700 mb-1.5"
                for="keterangan"
                >Keterangan</label
              >
              <input
                type="text"
                name="keterangan"
                placeholder="opsional"
                id="keterangan"
                class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
              />
            </div>
          </div>

          <!-- Tombol Simpan -->
          <div class="pt-2">
            <button
              type="submit"
              id="submit-form"
              class="w-full btn bg-[#181e2b] hover:bg-slate-800 text-white font-medium py-3 rounded-lg text-sm transition shadow-sm"
            >
              Simpan Transaksi
            </button>
          </div>
        </form>
      </div>

      <!-- Kartu Ringkasan Bulan Ini -->
      <div class="bg-white rounded-xl border border-slate-200/80 p-6 shadow-sm">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">
          Ringkasan Bulan Ini
        </h2>
        <div class="grid grid-cols-3 text-center">
          <!-- Masuk -->
          <div>
            <p class="text-xs text-slate-500 font-medium mb-1">Masuk</p>
            <p class="text-base sm:text-lg font-bold text-[#10b981]">
              4.900.000
            </p>
          </div>
          <!-- Keluar -->
          <div>
            <p class="text-xs text-slate-500 font-medium mb-1">Keluar</p>
            <p class="text-base sm:text-lg font-bold text-[#ef4444]">654.000</p>
          </div>
          <!-- Saldo -->
          <div>
            <p class="text-xs text-slate-500 font-medium mb-1">Saldo</p>
            <p class="text-base sm:text-lg font-bold text-slate-800">
              4.246.000
            </p>
          </div>
        </div>
      </div>
    </main>
  </body>
  <script type="module" src="js/dom.js"></script>
  <script type="module" src="js/catat.js"></script>
</html>
